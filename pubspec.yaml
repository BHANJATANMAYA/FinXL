name: finxl
description: "FinXL personal finance app."
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  google_sign_in: ^6.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  timezone: ^0.11.0
  flutter_native_splash: ^2.4.7
  supabase_flutter: ^2.12.2
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.5
  permission_handler: ^11.3.1
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo/finxl_logo.png
  android_12:
    color: "#ffffff"
    image: assets/logo/finxl_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/finxl_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/logo/icons/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
